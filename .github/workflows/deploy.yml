name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  # Download links and version facts are read from GitHub Releases at build
  # time, so the site is rebuilt on a schedule to follow new releases.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

# Pages takes the built site as an artifact, so the workflow pushes nothing
# back to the repository and no gh-pages branch is kept.
permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started runs to the end; a newer one waits behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Every page round-trips byte for byte
        run: pnpm check:roundtrip

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm docs:build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
